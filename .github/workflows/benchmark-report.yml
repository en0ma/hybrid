name: Benchmark report provenance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate report collector and missing-result behavior
        run: python3 -m unittest discover -s scripts -p test_benchmark_report.py -v
      - name: Collect benchmark report from explicit observations
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/benchmark_report.py benchmarks/observations.csv \
            --output artifacts/benchmark-report.json \
            --commit "$COMMIT_SHA" \
            --toolchain "solana-v4.3.0"
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-benchmark-report
          path: artifacts/benchmark-report.json
          if-no-files-found: error
