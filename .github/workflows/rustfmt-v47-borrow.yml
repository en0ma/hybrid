name: Temporary Rustfmt V47 Borrow Fix
on:
  pull_request:
    paths:
      - 'staging/continuation_borrow_fix_buy.rs.txt'
      - 'staging/continuation_borrow_fix_sell.rs.txt'
      - '.github/workflows/rustfmt-v47-borrow.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V47_BUY
          rustfmt --edition 2021 --emit stdout staging/continuation_borrow_fix_buy.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V47_BUY
          echo BEGIN_V47_SELL
          rustfmt --edition 2021 --emit stdout staging/continuation_borrow_fix_sell.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V47_SELL
