name: Precommit Rustfmt Linked Book Preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format staged Rust before commit
        run: |
          cp ci/staging/multipage_preflight_lib.rs.txt /tmp/lib.rs
          cp ci/staging/multipage_preflight_swaps.rs.txt /tmp/swaps.rs
          rustfmt --edition 2021 /tmp/lib.rs /tmp/swaps.rs
          echo '===LIB_START==='
          base64 -w0 /tmp/lib.rs
          echo
          echo '===LIB_END==='
          echo '===SWAPS_START==='
          base64 -w0 /tmp/swaps.rs
          echo
          echo '===SWAPS_END==='
