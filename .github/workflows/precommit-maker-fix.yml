name: Precommit Rustfmt Maker Fix
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format ownership fix before committing
        run: |
          cp ci/staging/maker_custody_fix.rs.txt /tmp/real_token_maker_custody.rs
          rustfmt --edition 2021 /tmp/real_token_maker_custody.rs
          echo '===FORMATTED_START==='
          base64 -w0 /tmp/real_token_maker_custody.rs
          echo
          echo '===FORMATTED_END==='
