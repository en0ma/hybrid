name: Capital efficiency research
on:
  pull_request:
    paths:
      - "research/capital-efficiency/**"
      - ".github/workflows/capital-efficiency.yml"
  push:
    branches: [main]
    paths:
      - "research/capital-efficiency/**"
      - ".github/workflows/capital-efficiency.yml"
permissions:
  contents: read
jobs:
  model-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test capital reservation and cross-market execution invariants
        run: node --test research/capital-efficiency/model.test.mjs
      - name: Validate benchmark protocol and required provenance\n        run: |\n          node --test research/capital-efficiency/validate-experiment.test.mjs\n          node research/capital-efficiency/validate-experiment.mjs\n      - name: Test empirical result completeness gate
        run: node --test research/capital-efficiency/validate-results.test.mjs
      - name: Test finalized Solana receipt collection\n        run: node --test research/capital-efficiency/collect-receipts.test.mjs\n      - name: Validate paired workload experiment contract\n        run: |\n          node --test research/capital-efficiency/validate-workload.test.mjs\n          node research/capital-efficiency/validate-workload.mjs\n      - name: Validate two-protocol adapter execution contract\n        run: node --test research/capital-efficiency/run-workload.test.mjs\n      - name: Test authenticated Hybrid lifecycle adapter\n        run: node --test research/capital-efficiency/hybrid-evidence-adapter.test.mjs\n      - name: Test official Manifest SDK market preflight interface\n        run: node --test research/capital-efficiency/manifest-market.test.mjs\n      - name: Test Manifest SDK maker and taker instruction builders\n        run: node --test research/capital-efficiency/manifest-instructions.test.mjs\n      - name: Generate reproducible model artifact
        run: node research/capital-efficiency/run.mjs research/capital-efficiency/two-market-scenario.json "$RUNNER_TEMP/p2-capital-model.json"
      - name: Upload model results
        uses: actions/upload-artifact@v4
        with:
          name: p2-capital-model
          path: ${{ runner.temp }}/p2-capital-model.json
