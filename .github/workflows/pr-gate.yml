name: PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Review activity must not cancel tests for the same code head.
# Only a newer push can supersede a push-triggered validation run.
concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  MANIFEST_COMMIT: d04b7aa90b098ba64ebcdf398e9a24d89a9114d8
  SURFPOOL_VERSION: "1.5.0"
  SOLANA_VERSION: "v4.3.0"

jobs:
  review-and-head:
    name: Review threads + exact head
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR is not draft
        if: github.event.pull_request.draft
        run: |
          echo "::error::PR is draft."
          exit 1

      - name: Check unresolved review threads
        uses: actions/github-script@v7
        with:
          script: |
            const query = `
              query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    headRefOid
                    reviewThreads(first:100, after:$cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        isResolved
                        path
                        line
                        comments(last:1) {
                          nodes { author { login } url }
                        }
                      }
                    }
                  }
                }
              }`;
            let cursor = null;
            let head = null;
            const threads = [];
            do {
              const page = (await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: context.issue.number,
                cursor
              })).repository.pullRequest;
              head = page.headRefOid;
              threads.push(...page.reviewThreads.nodes);
              cursor = page.reviewThreads.pageInfo.hasNextPage
                ? page.reviewThreads.pageInfo.endCursor
                : null;
            } while (cursor);

            if (head !== process.env.PR_HEAD_SHA) {
              core.setFailed(`Head moved before validation: expected ${process.env.PR_HEAD_SHA}, got ${head}`);
              return;
            }

            const unresolved = threads.filter(t => !t.isResolved);
            if (unresolved.length) {
              core.summary.addHeading("Unresolved review threads");
              for (const t of unresolved) {
                const comment = t.comments.nodes[0];
                core.summary.addRaw(
                  `- ${t.path || "(conversation)"}:${t.line || ""} — @${comment?.author?.login || "unknown"} — ${comment?.url || ""}\n`
                );
              }
              await core.summary.write();
              core.setFailed(
                `${unresolved.length} review thread(s) remain unresolved. Validate each against the exact head, address actionable findings, then resolve them.`
              );
            }

  core-ci:
    name: Tests / state / SBF / fuzz / CU / bytecode
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 1
      - name: Assert exact checkout
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hybrid-native-v2
          cache-on-failure: true
      - name: Cache Solana CLI and SBF tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-v4.3.0-v1
      - name: Cache fuzz runner
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: ${{ runner.os }}-cargo-fuzz-v1
      - name: Run deterministic core CI
        run: |
          source ci/install-solana.sh
          bash ci/run.sh

  fork:
    name: Mainnet fork
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
      - name: Run Surfpool mainnet-fork suite
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: bash ci/fork.sh

  manifest:
    name: Manifest baseline
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: manifest-baseline-v1
          cache-on-failure: true
      - name: Cache Solana CLI and SBF tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-v4.3.0-v1
      # Cache archives are immutable. Use a unique write key for each run
      # and restore the newest compatible pinned-Manifest build.
      - name: Restore pinned Manifest build output
        id: manifest-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/manifest-target
          key: ${{ runner.os }}-manifest-d04b7aa90b098ba64ebcdf398e9a24d89a9114d8-solana-v4.3.0-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-manifest-d04b7aa90b098ba64ebcdf398e9a24d89a9114d8-solana-v4.3.0-v2-
      - name: Report Manifest cache restoration
        run: |
          echo "Manifest cache exact hit: ${{ steps.manifest-build-cache.outputs.cache-hit }}"
          echo "Manifest baseline SHA: $MANIFEST_COMMIT"
      - name: Restore Manifest compiler cache
        id: manifest-compiler-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/manifest-sccache
          key: ${{ runner.os }}-manifest-sccache-v0.16.0-d04b7aa90b098ba64ebcdf398e9a24d89a9114d8-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-manifest-sccache-v0.16.0-d04b7aa90b098ba64ebcdf398e9a24d89a9114d8-
      - name: Report compiler cache source
        run: |
          echo "MANIFEST_COMPILER_CACHE_HIT=${{ steps.manifest-compiler-cache.outputs.cache-hit }}"
          echo "MANIFEST_COMPILER_CACHE_KEY=${{ steps.manifest-compiler-cache.outputs.cache-matched-key }}"
          echo "MANIFEST_TARGET_CACHE_KEY=${{ steps.manifest-build-cache.outputs.cache-matched-key }}"
      - name: Install native Rust compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Test and build pinned Manifest
        env:
          MANIFEST_BASELINE_ONLY: "1"
          MANIFEST_NATIVE_SCCACHE: "1"
          SCCACHE_DIR: ${{ runner.temp }}/manifest-sccache
          SCCACHE_CACHE_SIZE: "1G"
          MANIFEST_TARGET_DIR: ${{ runner.temp }}/manifest-target
        run: |
          source ci/install-solana.sh
          bash ci/manifest-compare.sh

  manifest-cu:
    name: Hybrid CU comparison against pinned Manifest
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hybrid-native-v2
          cache-on-failure: true
          # The core lane writes shared dependencies. The CU lane restores them.
          save-if: "false"
      - name: Cache Solana CLI and SBF tools
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-v4.3.0-v1
      - name: Compare CU against pinned Manifest
        env:
          MANIFEST_COMPARE_ONLY: "1"
        run: |
          source ci/install-solana.sh
          bash ci/manifest-compare.sh

  merge-gate:
    name: Merge gate
    needs: [review-and-head, core-ci, fork, manifest, manifest-cu]
    if: always() && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI lane green
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if bad:
              print("Blocking merge; non-green jobs:", bad)
              sys.exit(1)
          PY

      - name: Re-verify exact PR head and review threads
        uses: actions/github-script@v7
        with:
          script: |
            const query = `
              query($owner:String!, $repo:String!, $number:Int!, $cursor:String) {
                repository(owner:$owner, name:$repo) {
                  pullRequest(number:$number) {
                    headRefOid
                    reviewThreads(first:100, after:$cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { isResolved }
                    }
                  }
                }
              }`;
            let cursor = null;
            let head = null;
            let unresolved = 0;
            do {
              const page = (await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: context.issue.number,
                cursor
              })).repository.pullRequest;
              head = page.headRefOid;
              unresolved += page.reviewThreads.nodes.filter(t => !t.isResolved).length;
              cursor = page.reviewThreads.pageInfo.hasNextPage
                ? page.reviewThreads.pageInfo.endCursor
                : null;
            } while (cursor);

            if (head !== process.env.PR_HEAD_SHA) {
              core.setFailed(
                `PR head changed during CI: validated ${process.env.PR_HEAD_SHA}, current ${head}`
              );
            }
            if (unresolved) {
              core.setFailed(`${unresolved} review thread(s) are unresolved.`);
            }
