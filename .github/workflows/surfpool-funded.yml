name: Funded Surfpool lifecycle evidence
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  six-stage-funded-lifecycle:
    # Deliberately opt-in: requires a trusted machine with Surfpool, Solana CLI,
    # SBF-capable Cargo, and the pinned-ID program deployment key or deployment.
    runs-on: [self-hosted, linux, surfpool]
    timeout-minutes: 25
    env:
      HYBRID_CLUSTER: surfpool
      SOLANA_RPC_URL: http://127.0.0.1:8899
      HYBRID_FIXTURE_DIR: ./.surfpool-fixture
      HYBRID_PROGRAM_KEYPAIR: ${{ secrets.HYBRID_PROGRAM_KEYPAIR_PATH }}
      HYBRID_DEPLOY_PAYER: ${{ secrets.HYBRID_DEPLOY_PAYER_PATH }}
    defaults:
      run:
        working-directory: devnet-demo
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify local execution tools
        run: |
          set -euo pipefail
          node --version
          cargo --version
          solana --version
          surfpool --version
      - name: Install fixture runner dependencies
        run: npm ci
      - name: Start isolated Surfpool runtime
        run: |
          set -euo pipefail
          # Must not share fixture state with other jobs on this self-hosted runner.
          surfpool start --offline --no-tui > surfpool.log 2>&1 &
          echo $! > surfpool.pid
          for i in $(seq 1 40); do
            if curl -fsS -X POST -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getGenesisHash"}' \
              "${SOLANA_RPC_URL}" | grep -q '"result"'; then exit 0; fi
            sleep 2
          done
          cat surfpool.log
          exit 1
      - name: Execute deployment, funded provision, six signed trades and checks
        run: npm run run:surfpool
      - name: Fail unless evidence proves six confirmed stages
        run: |
          node --input-type=module -e '
          import {readFileSync} from "node:fs";
          const d=".surfpool-fixture/";
          const run=JSON.parse(readFileSync(d+"run-report.json"));
          const evidence=JSON.parse(readFileSync(d+"lifecycle-evidence.json"));
          const receipts=JSON.parse(readFileSync(d+"verified-receipts.json"));
          if(!run.deployed||!run.provisioned||!run.lifecycleCompleted||!run.receiptsVerified||
            !evidence.completed||!evidence.tradeSettlement?.verified||
            !evidence.tradeSettlement?.partialBookFillVerified||
            evidence.stages?.length!==6||receipts.report?.length!==6||
            receipts.orderReceiptLink?.receiptSequenceLinked!==true||
            new Set(evidence.stages.map(x=>x.signature)).size!==6)
            throw Error("Funded Surfpool receipt verification incomplete");
          console.log(JSON.stringify({market:evidence.market,stages:run.signatures,
            tradeSettlement:evidence.tradeSettlement},null,2));
          '
      - name: Upload non-secret evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surfpool-funded-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            devnet-demo/.surfpool-fixture/run-report.json
            devnet-demo/.surfpool-fixture/provision-evidence.json
            devnet-demo/.surfpool-fixture/lifecycle-evidence.json
            devnet-demo/.surfpool-fixture/verified-receipts.json
            devnet-demo/surfpool.log
          # Never upload .surfpool-fixture/*.json glob: it contains secret keypairs.
      - name: Stop local runtime
        if: always()
        run: |
          if [ -f surfpool.pid ]; then kill "$(cat surfpool.pid)" 2>/dev/null || true; fi
