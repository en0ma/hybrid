name: Temporary Rustfmt V44
on:
  pull_request:
    paths:
      - 'staging/**'
      - '.github/workflows/rustfmt-v44.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_BID_FMT
          rustfmt --edition 2021 --emit stdout staging/multipage_bid.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_BID_FMT
          rustfmt --edition 2021 --config skip_children=true --emit stdout staging/state_lib_bid.rs.txt | tail -n +3 | diff -u staging/state_lib_bid.rs.txt -
