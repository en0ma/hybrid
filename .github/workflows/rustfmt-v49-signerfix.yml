name: Temporary Rustfmt V49 Signer Fix
on:
  pull_request:
    paths:
      - 'staging/v49_signer_fix_buy.rs.txt'
      - 'staging/v49_signer_fix_sell.rs.txt'
      - '.github/workflows/rustfmt-v49-signerfix.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V49_BUY
          rustfmt --edition 2021 --emit stdout staging/v49_signer_fix_buy.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V49_BUY
          echo BEGIN_V49_SELL
          rustfmt --edition 2021 --emit stdout staging/v49_signer_fix_sell.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V49_SELL
