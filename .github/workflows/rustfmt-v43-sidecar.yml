name: Temporary Rustfmt V43 Sidecar
on:
  pull_request:
    paths:
      - 'staging/multipage_buy_sidecar_fix.rs.txt'
      - '.github/workflows/rustfmt-v43-sidecar.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_FORMAT_SIDECAR
          rustfmt --edition 2021 --emit stdout staging/multipage_buy_sidecar_fix.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FORMAT_SIDECAR
