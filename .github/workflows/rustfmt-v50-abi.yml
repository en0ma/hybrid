name: Temporary Rustfmt V50 ABI
on:
  pull_request:
    paths:
      - 'staging/v50_client_abi_fix.rs.txt'
      - '.github/workflows/rustfmt-v50-abi.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V50_ABI
          rustfmt --edition 2021 --emit stdout staging/v50_client_abi_fix.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V50_ABI
