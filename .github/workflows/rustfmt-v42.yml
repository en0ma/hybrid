name: Temporary Rustfmt V42
on:
  pull_request:
    paths:
      - 'staging/**'
      - '.github/workflows/rustfmt-v42.yml'
  workflow_dispatch:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verify formatted module wiring and staged primitive
        run: |
          rustfmt --edition 2021 --config skip_children=true --emit stdout staging/state_lib.rs.txt | tail -n +3 | diff -u staging/state_lib.rs.txt -
          echo BEGIN_TEST_FORMAT_V42
          rustfmt --edition 2021 --emit stdout staging/multipage_ask_with_tests.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_TEST_FORMAT_V42
