name: Temporary Rustfmt V49 Signed Market Meta
on:
  pull_request:
    paths:
      - 'staging/v49_market_meta_buy.rs.txt'
      - 'staging/v49_market_meta_sell.rs.txt'
      - '.github/workflows/rustfmt-v49-marketmeta.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_META_BUY
          rustfmt --edition 2021 --emit stdout staging/v49_market_meta_buy.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_META_BUY
          echo BEGIN_META_SELL
          rustfmt --edition 2021 --emit stdout staging/v49_market_meta_sell.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_META_SELL
