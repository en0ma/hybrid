name: Temporary Rustfmt V43 Fixture
on:
  pull_request:
    paths:
      - 'staging/real_token_buy_sidecar_fixture.rs.txt'
      - '.github/workflows/rustfmt-v43-fixture.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_FORMAT_FIXTURE
          rustfmt --edition 2021 --emit stdout staging/real_token_buy_sidecar_fixture.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FORMAT_FIXTURE
