name: Temporary Rustfmt V46 Retirement
on:
  pull_request:
    paths:
      - 'staging/linked_retirement_0.rs.txt'
      - 'staging/linked_retirement_1.rs.txt'
      - '.github/workflows/rustfmt-v46.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_FMT_BUY_V46
          rustfmt --edition 2021 --emit stdout staging/linked_retirement_0.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FMT_BUY_V46
          echo BEGIN_FMT_SELL_V46
          rustfmt --edition 2021 --emit stdout staging/linked_retirement_1.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FMT_SELL_V46
