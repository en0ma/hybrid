name: Devnet frontend smoke build
on:
  pull_request:
    paths:
      - 'devnet-demo/**'
      - '.github/workflows/devnet-demo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-abi-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devnet-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
