name: Temporary Rustfmt V45 ABI
on:
  pull_request:
    paths:
      - 'staging/multipage_sell_abi.rs.txt'
      - '.github/workflows/rustfmt-v45-abi.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_SELL_ABI
          rustfmt --edition 2021 --emit stdout staging/multipage_sell_abi.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_SELL_ABI
