name: Temporary Rustfmt V47 Continuation
on:
  pull_request:
    paths:
      - 'staging/post_compaction_buy.rs.txt'
      - 'staging/post_compaction_sell.rs.txt'
      - '.github/workflows/rustfmt-v47.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_FMT_BUY_V47
          rustfmt --edition 2021 --emit stdout staging/post_compaction_buy.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FMT_BUY_V47
          echo BEGIN_FMT_SELL_V47
          rustfmt --edition 2021 --emit stdout staging/post_compaction_sell.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FMT_SELL_V47
