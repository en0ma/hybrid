name: Main Verification

on:
  push:
    branches: [main]

concurrency:
  group: main-verify
  cancel-in-progress: false

permissions:
  contents: read

env:
  MANIFEST_COMMIT: d04b7aa90b098ba64ebcdf398e9a24d89a9114d8
  SURFPOOL_VERSION: "1.5.0"

jobs:
  verify:
    name: Fresh main exact-head verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Assert fresh main head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Core CI
        run: bash ci/run.sh
      - name: Mainnet-fork suite
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: bash ci/fork.sh
      - name: Manifest baseline comparison
        run: bash ci/manifest-compare.sh
