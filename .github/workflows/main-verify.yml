name: Main Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: main-verify-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

# This fast check verifies the source commit. PR Gate is the sole owner of
# core tests, SBF, fuzz, CU, mainnet-fork, Manifest, and the merge gate.
# Do not duplicate expensive suites in this workflow.
jobs:
  verify:
    name: PR exact-head verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}
          fetch-depth: 1
      - name: Assert exact PR head
        run: test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
