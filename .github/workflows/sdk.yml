name: Client SDK
on:
  pull_request:
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned SDK test dependency
        run: npm --prefix sdk install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Run client ABI tests
        run: npm --prefix sdk test
