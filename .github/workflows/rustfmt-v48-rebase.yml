name: Temporary Rustfmt V48 Rebase
on:
  pull_request:
    paths:
      - 'staging/lifecycle_merged_buy.rs.txt'
      - 'staging/lifecycle_merged_sell.rs.txt'
      - '.github/workflows/rustfmt-v48-rebase.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_REBASE_BUY
          rustfmt --edition 2021 --emit stdout staging/lifecycle_merged_buy.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_REBASE_BUY
          echo BEGIN_REBASE_SELL
          rustfmt --edition 2021 --emit stdout staging/lifecycle_merged_sell.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_REBASE_SELL
