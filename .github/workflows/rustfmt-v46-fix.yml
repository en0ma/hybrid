name: Temporary Rustfmt V46 Corrected
on:
  pull_request:
    paths:
      - 'staging/linked_retirement_fix_buy.rs.txt'
      - 'staging/linked_retirement_fix_sell.rs.txt'
      - '.github/workflows/rustfmt-v46-fix.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_FMT_BUY_FIX
          rustfmt --edition 2021 --emit stdout staging/linked_retirement_fix_buy.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FMT_BUY_FIX
          echo BEGIN_FMT_SELL_FIX
          rustfmt --edition 2021 --emit stdout staging/linked_retirement_fix_sell.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FMT_SELL_FIX
