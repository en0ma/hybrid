name: Temporary Rustfmt V51 Lifetimes
on:
  pull_request:
    paths:
      - 'staging/v51_lifetime_fix.rs.txt'
      - '.github/workflows/rustfmt-v51-lifetime.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V51_FIXED
          rustfmt --edition 2021 --emit stdout staging/v51_lifetime_fix.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V51_FIXED
