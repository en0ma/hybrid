name: Temporary Rustfmt V42 Fix
on:
  pull_request:
    paths:
      - 'staging/multipage_ask_fix.rs.txt'
      - '.github/workflows/rustfmt-v42-fix.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format staging and emit encoded source
        run: |
          echo BEGIN_FORMAT_V42_FIX
          rustfmt --edition 2021 --emit stdout staging/multipage_ask_fix.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FORMAT_V42_FIX
