name: Temporary Rustfmt V50 Client
on:
  pull_request:
    paths:
      - 'staging/v50_client.rs.txt'
      - 'staging/v50_lib.rs.txt'
      - '.github/workflows/rustfmt-v50.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V50_CLIENT
          rustfmt --edition 2021 --emit stdout staging/v50_client.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V50_CLIENT
          echo BEGIN_V50_LIB
          rustfmt --edition 2021 --config skip_children=true --emit stdout staging/v50_lib.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V50_LIB
