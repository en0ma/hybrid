name: Temporary Rustfmt V51 Audit
on:
  pull_request:
    paths:
      - 'staging/v51_audit.rs.txt'
      - 'staging/v51_lib.rs.txt'
      - '.github/workflows/rustfmt-v51.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V51_AUDIT
          rustfmt --edition 2021 --emit stdout staging/v51_audit.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V51_AUDIT
          echo BEGIN_V51_LIB
          rustfmt --edition 2021 --config skip_children=true --emit stdout staging/v51_lib.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V51_LIB
