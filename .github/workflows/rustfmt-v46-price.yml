name: Temporary Rustfmt V46 Market Price
on:
  pull_request:
    paths:
      - 'staging/linked_price_buy.rs.txt'
      - 'staging/linked_price_sell.rs.txt'
      - '.github/workflows/rustfmt-v46-price.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_FMT_BUY_PRICE
          rustfmt --edition 2021 --emit stdout staging/linked_price_buy.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FMT_BUY_PRICE
          echo BEGIN_FMT_SELL_PRICE
          rustfmt --edition 2021 --emit stdout staging/linked_price_sell.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_FMT_SELL_PRICE
