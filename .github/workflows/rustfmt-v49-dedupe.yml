name: Temporary Rustfmt V49 Validation Dedupe
on:
  pull_request:
    paths:
      - 'staging/v49_dedup_validation.rs.txt'
      - '.github/workflows/rustfmt-v49-dedupe.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V49_DEDUPE
          rustfmt --edition 2021 --emit stdout staging/v49_dedup_validation.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V49_DEDUPE
