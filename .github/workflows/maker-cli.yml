name: Maker CLI tests
on:
  pull_request:
    paths:
      - "tools/maker-cli/**"
      - ".github/workflows/maker-cli.yml"
  push:
    branches: [main]
    paths:
      - "tools/maker-cli/**"
      - ".github/workflows/maker-cli.yml"
permissions:
  contents: read
jobs:
  maker-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CLI and downstream dependencies
        run: |
          npm --prefix tools/maker-cli install --no-audit --no-fund
          npm --prefix devnet-demo install --no-audit --no-fund
      - name: Test maker CLI
        run: npm --prefix tools/maker-cli test
