name: Temporary Rustfmt V49 Maker
on:
  pull_request:
    paths:
      - 'staging/linked_maker_v49.rs.txt'
      - 'staging/lib_v49.rs.txt'
      - '.github/workflows/rustfmt-v49.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V49_MAKER
          rustfmt --edition 2021 --emit stdout staging/linked_maker_v49.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V49_MAKER
          echo BEGIN_V49_LIB
          rustfmt --edition 2021 --config skip_children=true --emit stdout staging/lib_v49.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V49_LIB
