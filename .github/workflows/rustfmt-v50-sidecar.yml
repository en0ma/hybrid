name: Temporary Rustfmt V50 Forged Sidecars
on:
  pull_request:
    paths:
      - 'staging/v50_forged_owned_buy.rs.txt'
      - 'staging/v50_forged_owned_sell.rs.txt'
      - '.github/workflows/rustfmt-v50-sidecar.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          echo BEGIN_V50_BUY
          rustfmt --edition 2021 --emit stdout staging/v50_forged_owned_buy.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V50_BUY
          echo BEGIN_V50_SELL
          rustfmt --edition 2021 --emit stdout staging/v50_forged_owned_sell.rs.txt | tail -n +3 | base64 -w0
          echo
          echo END_V50_SELL
