[package]
name = "hybrid-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hybrid-engine = { path = "../crates/engine" }
hybrid-state = { path = "../crates/state" }

[[bin]]
name = "passive_quote"
