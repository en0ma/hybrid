[workspace]
members = ["crates/engine", "crates/state", "crates/settlement", "program"]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
hybrid-engine = { path = "crates/engine" }
hybrid-state = { path = "crates/state" }
hybrid-settlement = { path = "crates/settlement" }
solana-program = "=4.0.0"
solana-program-test = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-instruction = "=3.4.0"
solana-account = "=4.3.2"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-transaction = "=4.1.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.metadata.solana]
tools-version = "v1.57"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Balance compiled engine size against the compute-unit cost of the
# multipage matcher. Global opt-level z regressed its CU; level 3 exceeded
# the SBF binary-size guard. Optimize the engine for size without z's
# most aggressive speed trade-offs.
[profile.release.package.hybrid-engine]
opt-level = "s"
